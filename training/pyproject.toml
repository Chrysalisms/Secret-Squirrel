[project]
name = "secret-squirrel-training"
version = "0.1.0"
description = "Training pipeline for Secret Squirrel CNN credential classifiers"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # ONNX export
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    # Data
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    # Transforms / tokenization reference
    "transformers>=4.41.0",
    # Utilities
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "rich>=13.7.0",
    "onnxscript>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]
