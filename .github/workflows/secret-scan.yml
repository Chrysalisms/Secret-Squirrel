name: Secret Squirrel — Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      scan_depth:
        description: "Git commit depth to scan (0 = full history)"
        required: false
        default: "0"
        type: string
      fail_on_severity:
        description: "Minimum severity to fail the build (info/low/medium/high/critical)"
        required: false
        default: "high"
        type: choice
        options: ["info", "low", "medium", "high", "critical"]

# Prevent concurrent scans on the same ref
concurrency:
  group: secret-squirrel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write     # For SARIF upload
  pull-requests: write       # For PR comments

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for git history scanning
          fetch-depth: ${{ github.event.inputs.scan_depth || 0 }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Secret Squirrel (release, CPU-only)
        run: |
          cargo build --release --no-default-features \
            --features cli,cpu-simd \
            --bin squirrel
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run secret scan
        id: scan
        run: |
          mkdir -p scan-output
          ./target/release/squirrel detect \
            --format sarif \
            --output scan-output/results.sarif \
            --severity ${{ github.event.inputs.fail_on_severity || 'high' }} \
            . || true
          ./target/release/squirrel detect \
            --format json \
            --output scan-output/results.json \
            --severity ${{ github.event.inputs.fail_on_severity || 'high' }} \
            --fail-on ${{ github.event.inputs.fail_on_severity || 'high' }} \
            . 2>&1 | tee scan-output/scan.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          SQUIRREL_LOG: "warn"

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan-output/results.sarif
          category: secret-squirrel
        continue-on-error: true  # Don't fail if SARIF upload fails (e.g., GHAS not enabled)

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-squirrel-results
          path: scan-output/
          retention-days: 30

      - name: Post PR summary comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let summary = '## 🐿️ Secret Squirrel Scan Results\n\n';
            
            try {
              const results = JSON.parse(fs.readFileSync('scan-output/results.json', 'utf8'));
              const count = results.findings?.length || 0;
              
              if (count === 0) {
                summary += '✅ **No secrets detected** in this pull request.\n';
              } else {
                summary += `⚠️ **${count} potential secret(s) detected:**\n\n`;
                summary += '| Rule | Severity | File | Line |\n';
                summary += '|------|----------|------|------|\n';
                
                const displayed = results.findings.slice(0, 20);
                for (const f of displayed) {
                  const file = f.location?.path || 'unknown';
                  const line = f.location?.start_line || '?';
                  summary += `| ${f.rule_id} | ${f.severity?.toUpperCase()} | \`${file}\` | ${line} |\n`;
                }
                
                if (count > 20) {
                  summary += `\n_...and ${count - 20} more findings. See the full report in the workflow artifacts._\n`;
                }
              }
            } catch (e) {
              summary += '⚠️ Could not parse scan results. Check the workflow logs.\n';
            }
            
            summary += '\n---\n_Powered by [Secret Squirrel](https://github.com/Chrysalisms/Secret-Squirrel)_';
            
            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existing = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('Secret Squirrel Scan Results')
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }

      - name: Fail on critical/high findings
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::Secret Squirrel found secrets at or above '${{ github.event.inputs.fail_on_severity || 'high' }}' severity."
          echo "Review the scan results in the workflow artifacts and PR comment."
          cat scan-output/scan.log | grep -E 'CRITICAL|HIGH' | head -20 || true
          exit 1
