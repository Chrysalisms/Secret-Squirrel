name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: squirrel

permissions:
  contents: write

jobs:
  # ── Build Artifacts ─────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (static musl via cross)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            archive: tar.gz

          # Linux aarch64 (static musl via cross)
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            archive: tar.gz

          # macOS x86_64 (native)
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive: tar.gz

          # macOS arm64 (native)
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
            archive: tar.gz

          # Windows x86_64 (native MSVC)
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── cross (Linux musl only) ────────────────────────────────────────────
      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      # ── Cargo cache ───────────────────────────────────────────────────────
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package: Linux / macOS → tar.gz ───────────────────────────────────
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="squirrel-${TAG}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" .
          tar czf "${ARCHIVE}" "${{ env.BINARY_NAME }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── Package: Windows → zip ─────────────────────────────────────────────
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $archive = "squirrel-$tag-x86_64-windows.zip"
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" .
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe" -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Upload archive as workflow artifact ────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Secret Squirrel ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
