---
# Ansible playbook fixture — planted secrets for integration testing
- name: Deploy Application
  hosts: production
  vars:
    db_password: "super_secret_password_123"
    stripe_api_key: "sk_live_abcdefghijklmnopqrstuvwxyz123456"
    aws_access_key: "AKIAIOSFODNN7EXAMPLE"
    aws_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    github_token: "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ123456789012"

  tasks:
    - name: Configure application
      template:
        src: app.conf.j2
        dest: /etc/app/app.conf
      vars:
        db_url: "postgresql://admin:{{ db_password }}@prod.db.example.com:5432/mydb"

    - name: Set AWS credentials
      lineinfile:
        path: /home/deploy/.aws/credentials
        line: "aws_secret_access_key = {{ aws_secret_key }}"

    - name: Configure Stripe
      environment:
        STRIPE_KEY: "{{ stripe_api_key }}"
      shell: "/app/configure-payments.sh"
