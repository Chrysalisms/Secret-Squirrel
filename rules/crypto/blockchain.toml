category = "cloud"
regex = '''(?i)alchemy[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-zA-Z0-9_-]{32})['"]?|https://(?:eth|polygon|arb|opt)-mainnet\.g\.alchemy\.com/v2/([a-zA-Z0-9_-]{32})'''
