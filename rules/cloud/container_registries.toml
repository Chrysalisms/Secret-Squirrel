# Container and cloud-native secrets
# Covers Docker Hub, GitHub Container Registry, Amazon ECR, Azure Container Registry, Harbor

[[rules]]
id = "docker-hub-personal-access-token"
description = "Docker Hub personal access token (dckr_pat_ prefix)"
severity = "critical"
category = "cloud"
regex = '''dckr_pat_[A-Za-z0-9_\-]{22}'''
keywords = ["dckr_pat_", "docker", "DOCKER_TOKEN"]
entropy = 4.0
tags = ["docker", "container", "devtools"]

[[rules]]
id = "docker-config-auth"
description = "Docker registry auth blob in ~/.docker/config.json"
severity = "critical"
category = "cloud"
regex = '''"auth"\s*:\s*"([A-Za-z0-9+/]{20,}={0,2})"'''
keywords = ['"auth":', "docker", ".docker/config.json"]
entropy = 4.0
tags = ["docker", "container", "registry"]

[[rules]]
id = "harbor-admin-password"
description = "Harbor container registry admin password"
severity = "high"
category = "devtools"
regex = '''(?i)harbor[._-]?(?:admin[._-]?)?password\s*[=:]\s*['"]?([A-Za-z0-9!@#$%^&*\-_]{8,})['"]?'''
keywords = ["harbor", "HARBOR_ADMIN"]
entropy = 3.5
tags = ["harbor", "container", "registry"]

[[rules]]
id = "quay-robot-account-token"
description = "Quay.io / Red Hat Quay robot account token"
severity = "high"
category = "cloud"
regex = '''(?i)quay[._-]?(?:io[._-]?)?(?:robot[._-]?|token[._-]?)?(?:token|password)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40,64})['"]?'''
keywords = ["quay.io", "quay"]
entropy = 4.0
tags = ["quay", "redhat", "container", "cloud"]

[[rules]]
id = "podman-registry-credentials"
description = "Podman / RHEL container registry credentials"
severity = "high"
category = "cloud"
regex = '''(?i)(?:podman|registry)[._-]?password\s*[=:]\s*['"]?([A-Za-z0-9!@#$%^&*\-_]{8,})['"]?'''
keywords = ["podman", "REGISTRY_PASSWORD"]
entropy = 3.0
tags = ["podman", "container", "registry"]

[[rules]]
id = "github-actions-cache-token"
description = "GitHub Actions cache service URL with embedded auth"
severity = "high"
category = "ci"
regex = '''ACTIONS_RUNTIME_TOKEN=[A-Za-z0-9+/._=]{100,}'''
keywords = ["ACTIONS_RUNTIME_TOKEN"]
entropy = 5.0
tags = ["github-actions", "ci", "cache"]

[[rules]]
id = "aws-ecr-password"
description = "AWS ECR authentication password (generated by get-login-password)"
severity = "critical"
category = "cloud"
regex = '''eyJwYXlsb2FkIjoiW[A-Za-z0-9+/]{100,}={0,2}'''
keywords = ["aws ecr", "ECR_PASSWORD", "get-login-password"]
entropy = 5.0
tags = ["aws", "ecr", "container", "cloud"]
