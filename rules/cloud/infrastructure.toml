# Network equipment and infrastructure secrets
# Covers Cisco, Meraki, Juniper, Palo Alto, Fortinet

[[rules]]
id = "cisco-meraki-api-key"
description = "Cisco Meraki cloud dashboard API key"
severity = "high"
category = "cloud"
regex = '''[\w.-]{0,50}?(?i:[\w.-]{0,50}?(?:Meraki|MERAKI)(?:[ \t\w.-]{0,20})[\s'"]{0,3})(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([0-9a-f]{40})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["meraki"]
entropy = 3.0
tags = ["cisco", "meraki", "networking", "cloud"]

[[rules]]
id = "fortinet-api-token"
description = "Fortinet FortiGate REST API token"
severity = "high"
category = "cloud"
regex = '''(?i)fortinet[._-]?(?:api[._-]?)?(?:key|token|secret)\s*[=:]\s*['"]?([A-Za-z0-9_-]{32,})['"]?'''
keywords = ["fortinet"]
entropy = 4.0
tags = ["fortinet", "networking", "firewall"]

[[rules]]
id = "pagerduty-api-key"
description = "PagerDuty REST API key or integration key"
severity = "high"
category = "saas"
regex = '''(?i)pagerduty[._-]?(?:api[._-]?|integration[._-]?)?(?:key|token|secret)\s*[=:]\s*['"]?([a-zA-Z0-9_+/-]{20,})['"]?'''
keywords = ["pagerduty"]
entropy = 3.5
tags = ["pagerduty", "incident-management", "saas"]

[[rules]]
id = "opsgenie-api-key"
description = "OpsGenie / Atlassian OpsGenie API key"
severity = "high"
category = "saas"
regex = '''(?i)opsgenie[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})['"]?'''
keywords = ["opsgenie"]
entropy = 3.0
tags = ["opsgenie", "incident-management", "saas"]

[[rules]]
id = "victorops-api-key"
description = "VictorOps / Splunk On-Call API key"
severity = "high"
category = "saas"
regex = '''(?i)victorops[._-]?(?:api[._-]?)?(?:key|token|id)\s*[=:]\s*['"]?([A-Za-z0-9_-]{20,})['"]?'''
keywords = ["victorops", "splunk_oncall"]
entropy = 3.5
tags = ["victorops", "splunk", "incident-management"]

[[rules]]
id = "cloudwatch-alarm-action-arn"
description = "AWS CloudWatch alarm action ARN with embedded account ID"
severity = "medium"
category = "cloud"
regex = '''arn:aws:sns:[a-z0-9-]+:(\d{12}):[a-zA-Z0-9_-]+'''
keywords = ["arn:aws:sns"]
entropy = 2.0
tags = ["aws", "cloudwatch", "sns", "cloud"]

[[rules]]
id = "ngrok-auth-token"
description = "ngrok authentication token for tunneling"
severity = "high"
category = "devtools"
regex = '''(?i)ngrok[._-]?(?:auth[._-]?)?token\s*[=:]\s*['"]?([a-zA-Z0-9_]{40,80})['"]?'''
keywords = ["ngrok"]
entropy = 4.0
tags = ["ngrok", "tunneling", "devtools"]

[[rules]]
id = "tailscale-api-key"
description = "Tailscale API key for network management"
severity = "high"
category = "cloud"
regex = '''(?i)tailscale[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?(tskey-[a-zA-Z0-9_-]{20,})['"]?'''
keywords = ["tailscale", "tskey-"]
entropy = 4.0
tags = ["tailscale", "vpn", "networking"]

[[rules]]
id = "cloudinary-api-secret"
description = "Cloudinary cloud storage API secret"
severity = "high"
category = "cloud"
regex = '''(?i)cloudinary[._-]?(?:api[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_-]{27})['"]?'''
keywords = ["cloudinary"]
entropy = 4.0
tags = ["cloudinary", "media", "cloud"]
