# Edge computing, serverless, and PaaS platform secrets
# Covers Vercel, Netlify, Heroku, Railway, Render, fly.io

[[rules]]
id = "vercel-access-token"
description = "Vercel deployment API access token"
severity = "critical"
category = "cloud"
regex = '''(?i)vercel[._-]?(?:access[._-]?|api[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{24})['"]?'''
keywords = ["vercel", "VERCEL_TOKEN"]
entropy = 3.5
tags = ["vercel", "serverless", "paas"]

[[rules]]
id = "netlify-api-token"
description = "Netlify deployment API personal access token"
severity = "critical"
category = "cloud"
regex = '''(?i)netlify[._-]?(?:api[._-]?|personal[._-]?access[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40})['"]?'''
keywords = ["netlify", "NETLIFY_AUTH_TOKEN"]
entropy = 4.5
tags = ["netlify", "serverless", "paas"]

[[rules]]
id = "railway-api-token"
description = "Railway.app deployment platform API token"
severity = "high"
category = "cloud"
regex = '''(?i)railway[._-]?(?:api[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{64})['"]?'''
keywords = ["railway", "RAILWAY_TOKEN"]
entropy = 4.5
