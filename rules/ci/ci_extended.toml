# CI/CD pipeline extended secrets
# Covers Travis CI, AppVeyor, Buildkite, TeamCity, Bamboo, Jenkins

[[rules]]
id = "travis-ci-api-token"
description = "Travis CI API token for build automation"
severity = "high"
category = "ci"
regex = '''(?i)travis[._-]?(?:ci[._-]?)?(?:api[._-]?)?token\s*[=:]\s*['"]?([a-zA-Z0-9_\-]{22})['"]?'''
keywords = ["travis", "TRAVIS_TOKEN"]
entropy = 3.5
tags = ["travis", "ci", "devtools"]

[[rules]]
id = "appveyor-api-token"
