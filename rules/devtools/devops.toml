# DevOps and Platform Engineering secrets
# Covers Kubernetes, Helm, Terraform, Pulumi, Ansible Tower, ArgoCD

[[rules]]
id = "kubernetes-client-certificate"
description = "Kubernetes client certificate data (base64 encoded)"
severity = "critical"
category = "cloud"
regex = '''(?i)client-certificate-data:\s+([A-Za-z0-9+/]{100,}={0,2})'''
keywords = ["client-certificate-data"]
entropy = 5.0
tags = ["kubernetes", "k8s", "tls"]

[[rules]]
id = "helm-chart-registry-password"
description = "Helm chart registry password"
severity = "high"
category = "devtools"
regex = '''(?i)helm[._-]?(?:registry[._-]?|chart[._-]?)?password\s*[=:]\s*['"]?([A-Za-z0-9!@#$%^&*\-_]{8,})['"]?'''
keywords = ["helm", "HELM_REGISTRY"]
entropy = 3.0
tags = ["helm", "kubernetes", "devtools"]

[[rules]]
id = "pulumi-access-token"
description = "Pulumi infrastructure-as-code access token"
severity = "critical"
category = "devtools"
regex = '''pul-[a-f0-9]{40}'''
keywords = ["pulumi", "pul-"]
entropy = 4.0
tags = ["pulumi", "iac", "devtools"]

[[rules]]
id = "argocd-auth-token"
description = "Argo CD authentication token for GitOps"
severity = "critical"
category = "devtools"
regex = '''(?i)argocd[._-]?(?:auth[._-]?|api[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9\._\-]{40,})['"]?'''
keywords = ["argocd", "ARGOCD_TOKEN"]
entropy = 4.0
tags = ["argocd", "gitops", "kubernetes", "devtools"]

[[rules]]
id = "flux-github-token"
description = "FluxCD GitHub PAT for GitOps reconciliation"
severity = "high"
category = "devtools"
regex = '''(?i)flux[._-]?(?:github[._-]?|git[._-]?)?token\s*[=:]\s*['"]?(gh[psor]_[A-Za-z0-9]{36})['"]?'''
keywords = ["flux", "FLUX_TOKEN"]
entropy = 4.0
tags = ["flux", "gitops", "github", "devtools"]

[[rules]]
id = "ansible-tower-password"
description = "Ansible Tower / AWX admin password"
severity = "high"
category = "devtools"
regex = '''(?i)(?:ansible|awx)[._-]?(?:tower[._-]?)?(?:admin[._-]?)?password\s*[=:]\s*['"]?([A-Za-z0-9!@#$%^&*\-_]{8,})['"]?'''
keywords = ["ansible", "AWX_PASSWORD"]
entropy = 3.0
tags = ["ansible", "awx", "devops", "devtools"]

[[rules]]
id = "nomad-secret-id"
description = "HashiCorp Nomad ACL token secret ID"
severity = "critical"
category = "devtools"
regex = '''(?i)nomad[._-]?(?:acl[._-]?)?(?:token|secret[._-]?id)\s*[=:]\s*['"]?([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})['"]?'''
keywords = ["nomad", "NOMAD_TOKEN"]
entropy = 3.0
tags = ["nomad", "hashicorp", "devtools"]

[[rules]]
id = "consul-acl-token"
description = "HashiCorp Consul ACL token"
severity = "critical"
category = "devtools"
regex = '''(?i)consul[._-]?(?:acl[._-]?|http[._-]?)?token\s*[=:]\s*['"]?([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})['"]?'''
keywords = ["consul", "CONSUL_TOKEN", "CONSUL_HTTP_TOKEN"]
entropy = 3.0
tags = ["consul", "hashicorp", "service-mesh"]
