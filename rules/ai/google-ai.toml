# Secret Squirrel — Google AI Rules
# Google AI / Gemini / PaLM / AI Studio secret detection rules

# ==============================================================================
# Google — Gemini API Key
# ==============================================================================

[[rules]]
id = "google-gemini-api-key"
description = "Google Gemini API Key (AIza prefix, Google AI Studio)"
regex = '''(?i)(?:gemini[_\-\.\s]{0,10}(?:api[_\-\.\s]{0,5})?key|GEMINI_API_KEY|GOOGLE_GEMINI_KEY)\s{0,5}[:=]\s{0,5}["']?(AIza[0-9A-Za-z\-_]{35})["']?'''
keywords = ["GEMINI_API_KEY", "GOOGLE_GEMINI_KEY", "gemini_api_key", "gemini-api-key"]
severity = "critical"
category = "ai"
tags = ["google", "gemini", "ai"]
entropy_threshold = 3.5
allowlist = [
    'GEMINI_API_KEY=YOUR_API_KEY',
    'GEMINI_API_KEY=AIzaEXAMPLE',
    'GEMINI_API_KEY=<',
    'GEMINI_API_KEY=$\{',
]
remediation = "Rotate at https://aistudio.google.com/app/apikey. Restrict key to specific APIs and add referrer restrictions to prevent abuse."

