# AI/ML model hosting and inference platform secrets
# Covers Replicate, Hugging Face (extended), Cohere, Together AI, Fireworks, Groq

[[rules]]
id = "together-ai-api-key"
description = "Together AI inference API key"
severity = "critical"
category = "ai"
regex = '''(?i)together[._-]?(?:ai[._-]?)?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{64})['"]?'''
keywords = ["together", "TOGETHER_API_KEY"]
entropy = 4.5
tags = ["together-ai", "llm", "inference"]

[[rules]]
id = "fireworks-ai-api-key"
description = "Fireworks AI inference API key"
severity = "critical"
category = "ai"
regex = '''fw_[A-Za-z0-9]{32}'''
keywords = ["fw_", "fireworks", "FIREWORKS_API"]
entropy = 4.0
tags = ["fireworks", "llm", "inference"]

