# Developer tools and IDE secrets
# Covers JetBrains, Visual Studio Code, GitHub Copilot, Cursor, Warp

[[rules]]
id = "jetbrains-license-key"
description = "JetBrains IDE license key"
severity = "medium"
category = "devtools"
regex = '''[A-Z0-9]{4}-[A-Z0-9]{8}-[A-Z0-9]{8}-[A-Z0-9]{6}'''
keywords = ["jetbrains", "intellij", "phpstorm"]
entropy = 3.0
tags = ["jetbrains", "ide", "license"]

[[rules]]
id = "openai-org-id"
description = "OpenAI organization ID"
severity = "medium"
category = "ai"
regex = '''org-[A-Za-z0-9]{24}'''
keywords = ["openai", "org-", "OPENAI_ORG"]
entropy = 3.5
tags = ["openai", "ai", "ml"]

[[rules]]
id = "groq-api-key"
description = "Groq fast AI inference API key (gsk_/xai_ prefix)"
severity = "critical"
category = "ai"
regex = '''(?:gsk_[A-Za-z0-9]{52}|xai-[A-Za-z0-9_\-]{80,})'''
keywords = ["gsk_", "groq", "GROQ_API"]
entropy = 4.5
tags = ["groq", "ai", "ml"]

[[rules]]
id = "perplexity-api-key"
description = "Perplexity AI API key (pplx- prefix)"
severity = "critical"
category = "ai"
regex = '''pplx-[a-f0-9]{48}'''
keywords = ["pplx-", "perplexity"]
entropy = 4.5
tags = ["perplexity", "ai", "ml"]

[[rules]]
id = "stability-ai-api-key"
description = "Stability AI image generation API key (sk-)"
severity = "high"
category = "ai"
regex = '''sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}|(?i)stability[._-]?(?:ai[._-]?)?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?(sk-[A-Za-z0-9]{48,})['"]?'''
keywords = ["stability", "stable_diffusion", "STABILITY_KEY"]
entropy = 4.5
tags = ["stability", "stable-diffusion", "ai", "image"]

[[rules]]
id = "elevenlabs-api-key"
description = "ElevenLabs voice AI API key"
severity = "high"
category = "ai"
regex = '''(?i)elevenlabs[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32})['"]?'''
keywords = ["elevenlabs", "ELEVEN_API"]
entropy = 4.0
tags = ["elevenlabs", "voice", "tts", "ai"]

[[rules]]
id = "deepgram-api-key"
description = "Deepgram speech-to-text API key"
severity = "high"
category = "ai"
regex = '''(?i)deepgram[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{40})['"]?'''
keywords = ["deepgram"]
entropy = 4.5
tags = ["deepgram", "speech", "ai"]

[[rules]]
id = "assembly-ai-api-key"
description = "AssemblyAI speech recognition API key"
severity = "high"
category = "ai"
regex = '''(?i)assemblyai[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32})['"]?'''
keywords = ["assemblyai", "ASSEMBLYAI"]
entropy = 4.0
tags = ["assemblyai", "speech", "ai"]
