# Search and data indexing service secrets
# Covers Elasticsearch, Solr, Algolia, Meilisearch, Typesense, Pinecone, Weaviate

[[rules]]
id = "algolia-search-api-key"
description = "Algolia search API key (write/admin key)"
severity = "high"
category = "saas"
regex = '''(?i)algolia[._-]?(?:admin[._-]?|write[._-]?|search[._-]?)?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32})['"]?'''
keywords = ["algolia", "ALGOLIA_ADMIN", "ALGOLIA_SEARCH"]
entropy = 4.0
tags = ["algolia", "search", "saas"]

[[rules]]
id = "elastic-apm-secret-token"
description = "Elastic APM server secret token"
severity = "high"
category = "monitoring"
regex = '''(?i)(?:elastic[._-]?)?apm[._-]?secret[._-]?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,64})['"]?'''
keywords = ["ELASTIC_APM_SECRET_TOKEN", "apm_secret"]
entropy = 4.0
tags = ["elastic", "apm", "monitoring"]

[[rules]]
id = "meilisearch-master-key"
description = "Meilisearch master key for search API"
severity = "critical"
category = "saas"
regex = '''(?i)meilisearch[._-]?(?:master[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{16,})['"]?'''
keywords = ["meilisearch", "MEILI_MASTER_KEY"]
entropy = 4.0
tags = ["meilisearch", "search", "saas"]

[[rules]]
id = "typesense-api-key"
