[[rules]]
id = "elastic-cloud-endpoint"
description = "Elasticsearch Cloud endpoint with embedded API key"
severity = "critical"
category = "cloud"
regex = '''https://([A-Za-z0-9_\-]+:[A-Za-z0-9_\-=+/]{20,})@[a-z0-9\-]+\.es\.[a-z0-9\-]+\.cloud\.es\.io'''
keywords = ["es.io", "elastic.cloud", "elasticsearch"]
entropy = 4.0
tags = ["elastic", "elasticsearch", "cloud"]
