regex = '''(?i)typesense[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{16,})['"]?'''
keywords = ["typesense", "TYPESENSE_API_KEY"]
entropy = 3.5
tags = ["typesense", "search", "saas"]

