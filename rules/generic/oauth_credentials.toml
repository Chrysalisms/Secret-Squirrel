# Secret Squirrel — OAuth / Azure AD / Cloud App Credential Rules
# Covers the "uuid" CredData category (2,055 secrets, currently 4.7% recall)
# and "secret" category client_secret patterns.
#
# Root causes of FNs:
#  1. AAD Client IDs:    public const string AadClientId = "606ac3bb-...";
#  2. OAuth Client IDs:  const string clientId = "A6B1AFC9-...";
#  3. Client Secrets:    private const string TestClientSecret = "25dfef85...";
#  4. Azure App IDs:     public const string AzureDevOpsResourceId = "390e23ab-...";


# ==============================================================================
# OAuth / OpenID Client ID (UUID format)
# Catches: const string clientId = "606ac3bb-c34d-97b6-6dac-1e891f48d7c2"
#          AadClientId = "..."
# ==============================================================================

[[rules]]
id = "oauth-client-id"
description = "OAuth 2.0 / OpenID Connect client ID (UUID format) hardcoded in source"
regex = '''(?i)(?:client[_\-]?id|clientId|AadClientId|AzureClientId|AppClientId|ApplicationId|app[_\-]?id|tenant[_\-]?id|resource[_\-]?id|oauth[_\-]?client|consumer[_\-]?key|client[_\-]?identifier)\s{0,5}[:=]\s{0,5}["']([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})["']'''
keywords = ["client_id", "clientId", "AadClientId", "ApplicationId", "tenant_id", "tenantId", "app_id"]
severity = "medium"
category = "generic"
tags = ["oauth", "openid", "client-id", "azure", "uuid", "generic"]
entropy_threshold = 2.5
allowlist = [
    'client_id = "00000000-0000-0000-0000-000000000000"',
    'client_id = "xxxxxxxx-',
    'client_id = "$\{',
    'client_id = "<',
    'client_id = "YOUR_',
    'client_id = "EXAMPLE',
    # Well-known Microsoft first-party app IDs
    '"00000002-0000-0000-c000-000000000000"',
    '"00000003-0000-0000-c000-000000000000"',
    '"00000009-0000-0000-c000-000000000000"',
]
remediation = "Client IDs are not secret but should not be committed to public repos. Store in configuration files excluded from version control or in environment variables."

# ==============================================================================
# OAuth / Azure AD Client Secret
# Catches: private const string TestClientSecret = "25dfef85a6975b59979642510f36340c"
#          const string expectedClientSecret = "0C61707A2A04"
#          string clientSecret = "B9EA1E78AAA3A2D72DC"
# ==============================================================================

[[rules]]
id = "oauth-client-secret"
description = "OAuth 2.0 / OpenID Connect client secret hardcoded in source"
regex = '''(?i)(?:client[_\-]?secret|clientSecret|AppSecret|ApplicationSecret|oauth[_\-]?secret|consumer[_\-]?secret|client[_\-]?password|app[_\-]?password|azure[_\-]?secret|aad[_\-]?secret|sp[_\-]?secret|service[_\-]?principal[_\-]?secret)\s{0,5}[:=]\s{0,5}["'](?!\s*["'])(?!\$\{)(?!<)(?!\*)(?!YOUR)(?!EXAMPLE)(?!changeme)(?!replace)(?!placeholder)([A-Za-z0-9\-_\.+/=!@#%^&*]{8,200})["']'''
keywords = ["client_secret", "clientSecret", "ClientSecret", "AppSecret", "consumer_secret", "azure_secret", "sp_secret"]
severity = "critical"
category = "generic"
tags = ["oauth", "client-secret", "azure", "secret", "generic"]
entropy_threshold = 3.0
allowlist = [
    'client_secret = ""',
    'client_secret = None',
    'client_secret = null',
    'client_secret = "$\{',
    'client_secret = "<',
    'client_secret = "YOUR_',
    'client_secret = "EXAMPLE',
    'client_secret = "changeme',
    'client_secret = "placeholder',
    'client_secret = "\*\*\*',
    'ClientSecret = "your-',
    'ClientSecret = "secret"',
    'ClientSecret = "test"',
]
remediation = "Rotate this client secret immediately in the Azure Portal, Auth0, Okta, or your identity provider's dashboard. Store secrets in Azure Key Vault or equivalent."

# ==============================================================================
# Azure Active Directory Tenant ID (UUID format)
# Catches: tenantId = "4a5d24d8-b0e7-4d78-9ae7-6bffb0e2a6a4"
# ==============================================================================

[[rules]]
id = "azure-ad-tenant-id"
description = "Azure Active Directory tenant ID hardcoded in source"
regex = '''(?i)(?:tenant[_\-]?id|tenantId|directory[_\-]?id|directoryId|azure[_\-]?tenant|aad[_\-]?tenant|authority)\s{0,5}[:=]\s{0,5}["']([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})["']'''
keywords = ["tenant_id", "tenantId", "directory_id", "directoryId", "azure_tenant", "aad_tenant"]
severity = "low"
category = "cloud"
tags = ["azure", "aad", "tenant-id", "uuid", "cloud"]
entropy_threshold = 2.5
allowlist = [
    'tenant_id = "00000000-0000-0000-0000-000000000000"',
    'tenant_id = "$\{',
    'tenant_id = "<',
    'tenant_id = "common"',
    'tenant_id = "organizations"',
    'tenant_id = "consumers"',
]
remediation = "Tenant IDs are not secret but identify your Azure organization. Do not commit to public repositories. Use environment variables or configuration files."

# ==============================================================================
# NATS NKey Seed
# Catches: SUACSSL3UAHUDXKFSNVUZRF5UHPMWZ6BFDTJ7M6USDAEF7DTSV4EELY5L
# ==============================================================================

[[rules]]
id = "nats-nkey-seed"
description = "NATS NKey seed (user or account private key) hardcoded in source"
regex = '''(?:^|['"\s`])(SU[A-Z2-7]{56,58}|SA[A-Z2-7]{56,58}|SO[A-Z2-7]{56,58}|SC[A-Z2-7]{56,58})(?:['"\s`]|$)'''
keywords = ["SUACE", "nkey", "nkeys", "NATS", "seed"]
severity = "critical"
category = "saas"
tags = ["nats", "nkey", "seed", "private-key"]
entropy_threshold = 4.0
allowlist = []
remediation = "Revoke the NATS NKey seed immediately via nsc (NATS Security Credentials). Generate a new operator/account/user NKey pair and update your NATS server configuration."

# ==============================================================================
# JSON Web Key (JWK) Private Key Object
# Catches: {"kty":"RSA","d":"...","n":"...",...}
# ==============================================================================

[[rules]]
id = "jwk-private-key"
description = "JSON Web Key (JWK) private key hardcoded in source or config"
regex = '''\{[^{}]{0,200}"kty"\s{0,3}:\s{0,3}"(?:RSA|EC|OKP)"[^{}]{0,500}"d"\s{0,3}:\s{0,3}"([A-Za-z0-9\-_]{20,700})"[^{}]{0,500}\}'''
keywords = ["\"kty\"", "\"d\":", "JWK", "jwk", "json_web_key"]
severity = "critical"
category = "crypto"
tags = ["jwk", "json-web-key", "rsa", "ec", "private-key"]
entropy_threshold = 4.0
allowlist = []
remediation = "Rotate the JWK immediately. Generate a new key pair using your identity provider's key management interface and revoke the exposed private key."
