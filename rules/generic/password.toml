# Secret Squirrel — Password Pattern Rules
# Specific password assignment detection rules beyond generic-password-assignment

# ==============================================================================
# .env File — Password Entry
# ==============================================================================

[[rules]]
id = "dotenv-password"
description = "PASSWORD variable in .env or shell environment file with non-empty real value"
regex = '''(?i)^(?:[A-Z_]{0,30}_)?PASSWORD\s{0,5}=\s{0,5}["']?(?!\s*["']$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)(?!password)([^\s"']{8,200})["']?$'''
keywords = ["PASSWORD=", "_PASSWORD="]
severity = "high"
category = "generic"
tags = ["password", "dotenv", "environment", "generic"]
entropy_threshold = 2.5
allowlist = [
    'PASSWORD=YOUR_PASSWORD',
    'PASSWORD=changeme',
    'PASSWORD=password',
    'PASSWORD=<password>',
    'PASSWORD=$\{',
    'PASSWORD=secret',
    'PASSWORD=example',
]
remediation = "Add .env files to .gitignore and use a secret manager or encrypted secret storage. Never commit real credentials to version control."

# ==============================================================================
# YAML — Password Key
# ==============================================================================

[[rules]]
id = "yaml-password-key"
description = "Password value in YAML configuration files"
regex = '''(?i)^\s{0,20}(?:password|passwd|pwd)\s{0,5}:\s{0,5}["']?(?!\s*["']$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)(?!password)([^\s"'#]{6,200})["']?'''
keywords = ["password:", "passwd:", "pwd:"]
severity = "high"
category = "generic"
tags = ["password", "yaml", "generic"]
entropy_threshold = 2.5
allowlist = [
    'password: YOUR_PASSWORD',
    'password: changeme',
    'password: \{\{',
    'password: $\{',
    'password: null',
    'password: ""',
    'password: ~',
]
remediation = "Use YAML anchors referencing environment variables (e.g., `password: !ENV MYAPP_DB_PASS`) or a secrets management tool like SOPS or Vault."

# ==============================================================================
# JSON — Password Key
# ==============================================================================

[[rules]]
id = "json-password-key"
description = "Password value in JSON configuration files"
regex = '''"(?:password|passwd|pwd)"\s{0,5}:\s{0,5}"(?!\s*"$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)(?!password)([^"]{6,200})"'''
keywords = ["\"password\":", "\"passwd\":", "\"pwd\":"]
severity = "high"
category = "generic"
tags = ["password", "json", "generic"]
entropy_threshold = 2.5
allowlist = [
    '"password": "YOUR_PASSWORD"',
    '"password": "changeme"',
    '"password": "$\{',
    '"password": "<',
    '"password": ""',
    '"password": "\*\*\*\*"',
]
remediation = "Remove credentials from JSON configuration files. Use environment variable substitution or reference secrets from a vault at runtime."

# ==============================================================================
# Spring Boot — Datasource Password
# ==============================================================================

[[rules]]
id = "spring-datasource-password"
description = "Spring Boot datasource password in application.properties or application.yml"
regex = '''(?i)spring\.datasource\.password\s{0,5}=\s{0,5}(?!\s*$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)([^\s]{4,200})'''
keywords = ["spring.datasource.password", "spring_datasource_password"]
severity = "critical"
category = "generic"
tags = ["spring", "java", "database", "password", "generic"]
entropy_threshold = 2.5
allowlist = [
    'spring.datasource.password=YOUR_PASSWORD',
    'spring.datasource.password=changeme',
    'spring.datasource.password=$\{',
    'spring.datasource.password=',
]
remediation = "Use Spring's `@Value(\"${DB_PASSWORD}\")` with environment variables or Spring Cloud Vault integration. Never hardcode database credentials in application.properties."

# ==============================================================================
# Hibernate — Connection Password
# ==============================================================================

[[rules]]
id = "hibernate-password"
description = "Hibernate ORM database connection password in configuration"
regex = '''(?i)(?:hibernate\.connection\.password|javax\.persistence\.jdbc\.password)\s{0,5}=\s{0,5}(?!\s*$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)([^\s]{4,200})'''
keywords = ["hibernate.connection.password", "javax.persistence.jdbc.password"]
severity = "critical"
category = "generic"
tags = ["hibernate", "java", "database", "password", "generic"]
entropy_threshold = 2.5
allowlist = [
    'hibernate.connection.password=YOUR_PASSWORD',
    'hibernate.connection.password=changeme',
    'hibernate.connection.password=$\{',
    'hibernate.connection.password=',
]
remediation = "Use JNDI DataSource lookup or Hibernate's integration with application server credential stores. Externalize credentials using environment variables."

# ==============================================================================
# Django — Database Password
# ==============================================================================

[[rules]]
id = "django-database-password"
description = "Django settings.py database PASSWORD hardcoded"
regex = '''(?i)(?<=['\"])PASSWORD['\"]:\s{0,5}['\"](?!\s*['\"]$)(?!\$\{)(?!<)(?!YOUR_)(?!changeme)([^'"]{4,200})['\"]'''
keywords = ["'PASSWORD':", "\"PASSWORD\":", "DATABASES", "django"]
severity = "critical"
category = "generic"
tags = ["django", "python", "database", "password", "generic"]
entropy_threshold = 2.5
allowlist = [
    '"PASSWORD": "YOUR_PASSWORD"',
    "'PASSWORD': 'YOUR_PASSWORD'",
    "'PASSWORD': ''",
    '"PASSWORD": ""',
    "'PASSWORD': os.getenv",
    '"PASSWORD": os.environ',
]
remediation = "Use `os.environ.get('DB_PASSWORD')` in Django settings. Consider django-environ or python-decouple for .env file management. Never commit settings.py with real credentials."

# ==============================================================================
# Generic Password Variable
# ==============================================================================

[[rules]]
id = "generic-password-assignment"
description = "Generic password assignment"
regex = '''(?i)(?:password|passwd|pwd)\s*[=:]\s*['"]?([a-zA-Z0-9_\-!@#$%^&*+=/]{8,200})['"]?'''
keywords = ["password", "passwd", "pwd"]
severity = "medium"
category = "generic"
entropy_threshold = 2.5
allowlist = [
    'password="YOUR_PASSWORD"',
    'password="changeme"',
    'password="password"',
    'password=""',
    '\$\{',
    '<[A-Za-z]',
    'YOUR_',
    'changeme'
]
tags = ["password", "generic"]
