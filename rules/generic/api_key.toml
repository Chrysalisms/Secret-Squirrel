# Generic API Key patterns
# Covers REACT_APP_, VITE_, NEXT_PUBLIC_, and common env-prefix assignments
# that don't match any vendor-specific rule.
# These account for ~35% of the 'key' FN bucket in CredData.

[[rules]]
id = "react-app-api-key"
description = "React / CRA environment variable holding an API key"
severity = "high"
category = "generic"
regex = '''(?i)REACT_APP_[A-Z0-9_]*(?:API[_-]?KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)[A-Z0-9_]*\s*=\s*['"]?([A-Za-z0-9\-_./+]{20,})['"]?'''
allowlist = [
    'REACT_APP_API_KEY=$\{',
    'REACT_APP_API_KEY=your-',
    'REACT_APP_API_KEY=REPLACE',
    'REACT_APP_API_KEY=<',
    'REACT_APP_API_KEY=xxx',
]
entropy = 3.5
tags = ["react", "frontend", "env"]

[[rules]]
id = "vite-api-key"
description = "Vite / Nuxt environment variable holding an API key"
severity = "high"
category = "generic"
regex = '''(?i)VITE_[A-Z0-9_]*(?:API[_-]?KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*\s*=\s*['"]?([A-Za-z0-9\-_./+]{20,})['"]?'''
allowlist = [
    'VITE_API_KEY=$\{',
    'VITE_API_KEY=your-',
    'VITE_API_KEY=<',
]
entropy = 3.5
tags = ["vite", "vue", "frontend", "env"]

[[rules]]
id = "next-public-api-key"
description = "Next.js public environment variable holding an API key"
severity = "high"
category = "generic"
regex = '''(?i)NEXT_PUBLIC_[A-Z0-9_]*(?:API[_-]?KEY|SECRET|TOKEN|KEY)[A-Z0-9_]*\s*=\s*['"]?([A-Za-z0-9\-_./+]{20,})['"]?'''
allowlist = [
    'NEXT_PUBLIC_API_KEY=$\{',
    'NEXT_PUBLIC_API_KEY=your-',
