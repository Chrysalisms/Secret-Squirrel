allowlist = [
    '=$\{',
]
entropy = 3.5
tags = ["wasabi", "s3-compatible", "storage"]

[[rules]]
id = "linode-object-storage-key"
description = "Linode / Akamai object storage key"
severity = "high"
category = "storage"
regex = '''(?i)linode[._-]?(?:object[._-]?storage[._-]?)?(?:access[._-]?)?(?:key|secret)\s*[=:]\s*['"]?([A-Za-z0-9]{20,})['"]?'''
