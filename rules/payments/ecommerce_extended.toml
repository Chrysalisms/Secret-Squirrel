[[rules]]
id = "chargebee-api-key"
description = "Chargebee subscription management API key"
severity = "critical"
category = "payments"
regex = '''(?i)chargebee[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?(live|test)_[A-Za-z0-9_]{32,48}['"]?'''
keywords = ["chargebee", "CHARGEBEE_API"]
entropy = 4.0
tags = ["chargebee", "subscriptions", "billing"]
