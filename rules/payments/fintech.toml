# Fintech and financial service API secrets
# Covers Plaid, Yodlee, Dwolla, MangoPay, Adyen, PayPal (extended)

[[rules]]
id = "plaid-client-secret"
description = "Plaid financial data API client secret"
severity = "critical"
category = "payments"
regex = '''(?i)plaid[._-]?(?:client[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{30,40})['"]?'''
keywords = ["plaid", "PLAID_SECRET"]
entropy = 4.0
tags = ["plaid", "fintech", "banking"]

[[rules]]
id = "yodlee-api-secret"
description = "Yodlee / Envestnet financial data API secret"
severity = "high"
category = "payments"
regex = '''(?i)yodlee[._-]?(?:api[._-]?)?(?:secret|password|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,48})['"]?'''
keywords = ["yodlee"]
entropy = 4.0
tags = ["yodlee", "fintech", "banking"]

