# Secret Squirrel — Default Detection Rules
#
# This file is embedded into the binary at compile time.
# Format: Squirrel TOML (superset of Betterleaks; compatible with Gitleaks)
#
# Fields:
#   id                  — unique rule identifier (kebab-case)
#   description         — human-readable rule description
#   regex               — primary detection pattern (Rust regex syntax)
#   keywords            — Aho-Corasick pre-filter keywords (case-insensitive)
#   severity            — "critical" | "high" | "medium" | "low" | "info"
#   category            — "cloud" | "saas" | "devtools" | "database" |
#                         "crypto" | "ai" | "payments" | "generic"
#   allowlist           — regex patterns that suppress a finding if matched
#   entropy_threshold   — optional per-rule minimum Shannon entropy override
#   validation_provider — optional validator name
#   remediation         — short rotation guidance text

# ==============================================================================
# CLOUD — AWS
# ==============================================================================

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '\bAKIA[0-9A-Z]{16}\b'
keywords = ["AKIA"]
severity = "critical"
category = "cloud"
tags = ["aws", "iam", "cloud"]
allowlist = [
    'AKIAIOSFODNN7EXAMPLE',         # AWS documentation example key
    'AKIAI44QH8DHBEXAMPLE',
]
validation_provider = "aws"
remediation = "Revoke immediately at https://console.aws.amazon.com/iam/ → Security credentials → Access keys. Rotate all affected IAM permissions and audit CloudTrail for unauthorized usage."

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = "(?i)aws[_\\-\\s]*secret[_\\-\\s]*(?:access[_\\-\\s]*)?key\\s*[:=]\\s*[\"']?([A-Za-z0-9+/]{40})[\"']?"
keywords = ["aws_secret", "aws-secret", "AWS_SECRET"]
severity = "critical"
category = "cloud"
tags = ["aws", "iam", "cloud"]
entropy_threshold = 4.0
remediation = "Revoke at https://console.aws.amazon.com/iam/ and rotate all services using this credential."

# ==============================================================================
# DEVTOOLS — GitHub
# ==============================================================================

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token (classic)"
regex = '\bghp_[a-zA-Z0-9]{36}\b'
keywords = ["ghp_"]
severity = "critical"
category = "devtools"
tags = ["github", "token", "devtools"]
allowlist = ['ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX']
validation_provider = "github"
remediation = "Revoke at https://github.com/settings/tokens and generate a replacement with minimum required scopes."

[[rules]]
id = "github-oauth-token"
description = "GitHub OAuth Access Token"
regex = '\bgho_[a-zA-Z0-9]{36}\b'
keywords = ["gho_"]
severity = "critical"
category = "devtools"
tags = ["github", "oauth", "devtools"]
remediation = "Revoke at https://github.com/settings/tokens and rotate the OAuth application client secret."

[[rules]]
id = "github-app-token"
description = "GitHub App Installation Token"
regex = '\bghs_[a-zA-Z0-9]{36}\b'
keywords = ["ghs_"]
severity = "high"
category = "devtools"
tags = ["github", "app", "devtools"]
remediation = "Revoke at https://github.com/settings/tokens — installation tokens expire in 1 hour but should still be rotated."

[[rules]]
id = "github-refresh-token"
description = "GitHub User-to-Server Refresh Token"
regex = '\bghr_[a-zA-Z0-9]{76}\b'
keywords = ["ghr_"]
severity = "high"
category = "devtools"
tags = ["github", "oauth", "devtools"]
remediation = "Revoke via the GitHub OAuth app settings and reauthorize the app."

# ==============================================================================
# DEVTOOLS — GitLab
# ==============================================================================

[[rules]]
id = "gitlab-pat"
description = "GitLab Personal Access Token"
regex = '\bglpat-[a-zA-Z0-9\-_]{20}\b'
keywords = ["glpat-"]
severity = "critical"
category = "devtools"
tags = ["gitlab", "token", "devtools"]
validation_provider = "gitlab"
remediation = "Revoke at https://gitlab.com/-/user_settings/personal_access_tokens and create a replacement with minimum scopes."

[[rules]]
id = "gitlab-runner-token"
description = "GitLab Runner Registration Token"
regex = '\bGR1348941[a-zA-Z0-9\-_]{20}\b'
keywords = ["GR1348941"]
severity = "high"
category = "devtools"
tags = ["gitlab", "runner", "devtools"]
remediation = "Reset the runner token in GitLab → Settings → CI/CD → Runners and re-register affected runners."

# ==============================================================================
# SAAS — Slack
# ==============================================================================

[[rules]]
id = "slack-token"
description = "Slack API Token"
regex = '\bxox[baprs]-[a-zA-Z0-9\-]{10,48}\b'
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-"]
severity = "critical"
category = "saas"
tags = ["slack", "token", "saas"]
allowlist = ['xoxb-XXXX-XXXX-XXXX']
validation_provider = "slack"
remediation = "Revoke at https://api.slack.com/apps → OAuth & Permissions → Revoke All OAuth Tokens."

# ==============================================================================
# PAYMENTS — Stripe
# ==============================================================================

[[rules]]
id = "stripe-live-key"
description = "Stripe Live API Secret Key"
regex = '\bsk_live_[a-zA-Z0-9]{24,99}\b'
keywords = ["sk_live_"]
severity = "critical"
category = "payments"
tags = ["stripe", "live", "payments"]
validation_provider = "stripe"
remediation = "Roll immediately at https://dashboard.stripe.com/apikeys — Stripe supports zero-downtime key rotation."

[[rules]]
id = "stripe-test-key"
description = "Stripe Test API Secret Key"
regex = '\bsk_test_[a-zA-Z0-9]{24,99}\b'
keywords = ["sk_test_"]
severity = "medium"
category = "payments"
tags = ["stripe", "test", "payments"]
remediation = "Test keys are lower risk but should not be committed. Rotate at https://dashboard.stripe.com/test/apikeys."

# ==============================================================================
# SAAS — Twilio
# ==============================================================================

[[rules]]
id = "twilio-account-sid"
description = "Twilio Account SID"
regex = '\bAC[a-z0-9]{32}\b'
keywords = ["TWILIO_", "twilio"]
severity = "high"
category = "saas"
tags = ["twilio", "saas"]
allowlist = [
    'ACa{32}',       # all-a placeholder
    'AC0{32}',       # all-zero placeholder
]
remediation = "Rotate at https://console.twilio.com → Account → General Settings → API Keys."

# ==============================================================================
# SAAS — SendGrid
# ==============================================================================

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '\bSG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43}\b'
keywords = ["SG."]
severity = "high"
category = "saas"
tags = ["sendgrid", "email", "saas"]
validation_provider = "sendgrid"
remediation = "Delete and regenerate at https://app.sendgrid.com/settings/api_keys."

# ==============================================================================
# AI — OpenAI
# ==============================================================================

[[rules]]
