remediation = "Revoke at https://huggingface.co/settings/tokens and create a replacement with minimum required permissions."

# ==============================================================================
# GENERIC — Password Assignments
# ==============================================================================

[[rules]]
id = "generic-password-assignment"
description = "Generic password in variable assignment"
regex = "(?i)(password|passwd|pwd)\\s*[:=]\\s*[\"']?(?!.*\\$\\{)[^\\s\"']{8,}"
keywords = ["password", "passwd", "pwd"]
severity = "high"
category = "generic"
tags = ["password", "generic"]
allowlist = [
    "(?i)password\\s*[:=]\\s*[\"']?\\s*[\"']",      # empty value
    "(?i)password\\s*[:=]\\s*[\"']?\\s*\\*+\\s*[\"']", # masked with asterisks
    "(?i)password\\s*[:=]\\s*[\"']?YOUR_PASSWORD",    # placeholder
    "(?i)password\\s*[:=]\\s*[\"']?changeme",          # common placeholder
    "(?i)password\\s*[:=]\\s*[\"']?<[^>]+>",           # XML placeholder
]
entropy_threshold = 3.0
remediation = "Rotate the credential immediately, then move it to a secrets manager (e.g. AWS Secrets Manager, HashiCorp Vault, or your CI/CD platform's native secrets store)."

# ==============================================================================
# GENERIC — API Key Assignments
# ==============================================================================

[[rules]]
id = "generic-api-key"
description = "Generic API key in variable assignment"
regex = "(?i)(api[_\\-]?key|apikey)\\s*[:=]\\s*[\"']?[a-zA-Z0-9\\-_]{16,}[\"']?"
keywords = ["api_key", "apikey", "api-key", "API_KEY"]
severity = "medium"
category = "generic"
tags = ["api-key", "generic"]
allowlist = [
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?\\s*[\"']",         # empty
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?YOUR_API_KEY",      # placeholder
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?<[^>]+>",           # XML placeholder
]
entropy_threshold = 3.5
remediation = "Identify the service this key belongs to and rotate it via that service's developer console."

# ==============================================================================
# GENERIC — Token Assignments
# ==============================================================================

[[rules]]
id = "generic-token-assignment"
description = "Generic token in variable assignment"
regex = "(?i)(token|auth_token|access_token|secret_token)\\s*[:=]\\s*[\"']?[a-zA-Z0-9\\-_\\.]{16,}[\"']?"
keywords = ["token", "auth_token", "access_token", "secret_token"]
severity = "medium"
category = "generic"
tags = ["token", "generic"]
allowlist = [
    "(?i)token\\s*[:=]\\s*[\"']?\\s*[\"']",
    "(?i)token\\s*[:=]\\s*[\"']?YOUR_TOKEN",
    "(?i)token\\s*[:=]\\s*[\"']?<[^>]+>",
]
entropy_threshold = 3.5
remediation = "Identify the issuing service and rotate the token via its developer console."

# ==============================================================================
# CRYPTO — Private Keys
# ==============================================================================

[[rules]]
id = "private-key-generic"
description = "PEM private key header"
regex = '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
keywords = ["BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY", "BEGIN EC PRIVATE KEY"]
severity = "critical"
category = "crypto"
tags = ["crypto", "pem", "private-key"]
remediation = "Rotate the key pair immediately. Generate a new key with: openssl genrsa -out new-key.pem 4096 (RSA) or openssl ecparam -genkey -name prime256v1 (EC). Update all services and revoke/re-issue any certificates signed by this key."

# ==============================================================================
# GENERIC — JWT Tokens
# ==============================================================================

[[rules]]
id = "jwt-token"
description = "JSON Web Token (JWT)"
regex = '\beyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\b'
keywords = ["eyJ"]
severity = "high"
category = "generic"
tags = ["jwt", "token", "auth"]
allowlist = [
    'eyJhbGciOiJub25lIn0',  # "alg: none" — invalid by design
]
entropy_threshold = 4.0
remediation = "JWTs encode claims — if this is a long-lived token, revoke it immediately. Check if the JWT secret used to sign it has been exposed and rotate the signing key."

# ==============================================================================
# GENERIC — Bearer Tokens
# ==============================================================================

[[rules]]
id = "generic-bearer-token"
description = "HTTP Authorization Bearer token"
regex = '(?i)\bBearer\s+[a-zA-Z0-9\-_\.]{20,}'
keywords = ["Bearer "]
severity = "medium"
category = "generic"
tags = ["bearer", "http", "auth"]
allowlist = [
    '(?i)Bearer\s+YOUR_TOKEN',
    '(?i)Bearer\s+<[^>]+>',
    '(?i)Bearer\s+\$\{',
]
entropy_threshold = 3.5
remediation = "Identify the token issuer from context and rotate the credential via its developer console."
