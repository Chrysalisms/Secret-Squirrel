# ==============================================================================
# GENERIC — JWT Tokens
# ==============================================================================

[[rules]]
id = "jwt-token"
description = "JSON Web Token (JWT)"
regex = '\beyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\b'
keywords = ["eyJ"]
severity = "high"
category = "generic"
tags = ["jwt", "token", "auth"]
allowlist = [
    'eyJhbGciOiJub25lIn0',
]
entropy_threshold = 4.0
remediation = "If this is a long-lived token, revoke it and check if the JWT signing secret has been exposed."

# ==============================================================================
# GENERIC — Bearer Tokens
# ==============================================================================

[[rules]]
id = "generic-bearer-token"
description = "HTTP Authorization Bearer token"
regex = '(?i)\bBearer\s+[a-zA-Z0-9\-_\.]{20,}'
keywords = ["Bearer "]
severity = "medium"
category = "generic"
tags = ["bearer", "http", "auth"]
allowlist = [
    '(?i)Bearer\s+YOUR_TOKEN',
    '(?i)Bearer\s+<[^>]+>',
    '(?i)Bearer\s+\$\{',
]
entropy_threshold = 3.5
remediation = "Identify the token issuer from context and rotate the credential via its developer console."

# ==============================================================================
# GENERIC — Password Assignments
# ==============================================================================

[[rules]]
id = "generic-password-assignment"
description = "Generic password in variable assignment"
regex = "(?i)(password|passwd|pwd)\\s*[:=]\\s*[\"']?(?!.*\\$\\{)[^\\s\"']{8,}"
keywords = ["password", "passwd", "pwd"]
severity = "high"
category = "generic"
tags = ["password", "generic"]
allowlist = [
    "(?i)password\\s*[:=]\\s*[\"']?\\s*[\"']",
    "(?i)password\\s*[:=]\\s*[\"']?\\s*\\*+\\s*[\"']",
    "(?i)password\\s*[:=]\\s*[\"']?YOUR_PASSWORD",
    "(?i)password\\s*[:=]\\s*[\"']?changeme",
    "(?i)password\\s*[:=]\\s*[\"']?change_me",
    "(?i)password\\s*[:=]\\s*[\"']?<[^>]+>",
    "(?i)password\\s*[:=]\\s*[\"']?password",
    "(?i)password\\s*[:=]\\s*[\"']?testpassword",
    "(?i)password\\s*[:=]\\s*[\"']?password123",
    "(?i)password\\s*[:=]\\s*[\"']?admin",
    "(?i)password\\s*[:=]\\s*[\"']?letmein",
    "(?i)password\\s*[:=]\\s*[\"']?welcome",
    "(?i)password\\s*[:=]\\s*[\"']?qwerty",
    "(?i)password\\s*[:=]\\s*[\"']?null",
    "(?i)password\\s*[:=]\\s*[\"']?none",
    "(?i)password\\s*[:=]\\s*[\"']?undefined",
    "(?i)password\\s*[:=]\\s*[\"']?example",
    "(?i)password\\s*[:=]\\s*[\"']?placeholder",
    "(?i)password\\s*[:=]\\s*[\"']?secret\\b",
    # CI/CD references
    "(?i)password\\s*[:=]\\s*\\$\\{\\{",
    "(?i)password\\s*[:=]\\s*secrets\\.",
]
entropy_threshold = 3.5
remediation = "Rotate the credential immediately, then move it to a secrets manager."

# ==============================================================================
# GENERIC — API Key Assignments
# ==============================================================================

[[rules]]
id = "generic-api-key"
description = "Generic API key in variable assignment"
regex = "(?i)(api[_\\-]?key|apikey)\\s*[:=]\\s*[\"']?[a-zA-Z0-9\\-_]{16,}[\"']?"
keywords = ["api_key", "apikey", "api-key", "API_KEY"]
severity = "medium"
category = "generic"
tags = ["api-key", "generic"]
allowlist = [
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?\\s*[\"']",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?YOUR_API_KEY",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?YOUR[_-]",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?<[^>]+>",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?EXAMPLE",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?example",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?placeholder",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?mock",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?fake",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?dummy",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?test",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?null",
    "(?i)api[_-]?key\\s*[:=]\\s*[\"']?none",
    # CI/CD secret references
    "(?i)api[_-]?key\\s*[:=]\\s*\\$\\{\\{",
    "(?i)api[_-]?key\\s*[:=]\\s*secrets\\.",
]
entropy_threshold = 4.0
remediation = "Identify the service this key belongs to and rotate it via that service's developer console."

# ==============================================================================
# GENERIC — Token Assignments
# ==============================================================================

[[rules]]
id = "generic-token-assignment"
description = "Generic token in variable assignment"
regex = "(?i)(token|auth_token|access_token|secret_token)\\s*[:=]\\s*[\"']?[a-zA-Z0-9\\-_\\.]{16,}[\"']?"
keywords = ["token", "auth_token", "access_token", "secret_token"]
severity = "medium"
category = "generic"
tags = ["token", "generic"]
allowlist = [
    "(?i)token\\s*[:=]\\s*[\"']?\\s*[\"']",
    "(?i)token\\s*[:=]\\s*[\"']?YOUR_TOKEN",
    "(?i)token\\s*[:=]\\s*[\"']?YOUR[_-]",
    "(?i)token\\s*[:=]\\s*[\"']?<[^>]+>",
    "(?i)token\\s*[:=]\\s*[\"']?EXAMPLE",
    "(?i)token\\s*[:=]\\s*[\"']?example",
    "(?i)token\\s*[:=]\\s*[\"']?placeholder",
    "(?i)token\\s*[:=]\\s*[\"']?replace",
    "(?i)token\\s*[:=]\\s*[\"']?mock",
    "(?i)token\\s*[:=]\\s*[\"']?fake",
    "(?i)token\\s*[:=]\\s*[\"']?dummy",
    "(?i)token\\s*[:=]\\s*[\"']?test",
    "(?i)token\\s*[:=]\\s*[\"']?null",
    "(?i)token\\s*[:=]\\s*[\"']?none",
    # Numeric-only tokens are never real
    "(?i)token\\s*[:=]\\s*[\"']?[0-9]+[\"']?",
    # CI/CD secret references
    "(?i)token\\s*[:=]\\s*\\$\\{\\{",
    "(?i)token\\s*[:=]\\s*secrets\\.",
    # GitHub Actions special pattern
    "(?i)GITHUB_TOKEN\\s*:\\s*\\$\\{\\{",
    "(?i)AWS_ACCESS_KEY_ID\\s*:\\s*\\$\\{\\{",
]
entropy_threshold = 4.0
remediation = "Identify the issuing service and rotate the token via its developer console."

[[rules]]
id = "uuid-secret"
description = "UUID-formatted secret, API key, or access token assigned to a credential variable"
regex = '''(?i)(?:uuid|guid|client[_-]?id|client[_-]?secret|api[_-]?key|access[_-]?token|secret|key|token)\s{0,5}[:=]\s{0,5}["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})["']?'''
keywords = ["uuid", "guid", "client_id", "client_secret"]
severity = "medium"
category = "generic"
tags = ["uuid", "generic", "api"]
entropy_threshold = 3.0
allowlist = [
    "(?i)00000000-0000-0000-0000-000000000000",
    "(?i)xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
    "(?i)example",
    "(?i)placeholder",
    "(?i)sample",
    "(?i)test",
]
remediation = "Identify the issuing service (OAuth provider, cloud API) and rotate or revoke the credential."

[[rules]]
id = "basic-auth-credential"
description = "HTTP Basic Authorization header containing Base64-encoded credentials"
regex = '''(?i)(?:Authorization|auth|credential)\s{0,5}[:=]\s{0,5}["']?Basic\s+([A-Za-z0-9+/]{20,}={0,2})["']?'''
keywords = ["Basic", "Authorization", "authorization", "credential"]
severity = "high"
category = "generic"
tags = ["http", "basic-auth", "generic"]
entropy_threshold = 3.5
allowlist = [
    "(?i)dXNlcjpwYXNz",
    "(?i)YOUR_CREDENTIALS",
    "(?i)placeholder",
]
remediation = "Decode the Base64 string to obtain plaintext user:password. Immediately rotate the password and remove the credential from code."

[[rules]]
id = "url-embedded-credentials"
description = "Credentials embedded in a URL (user:password@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.]{1,15}://([^:@/\s]{3,50}:[^@/\s"']{3,100})@[a-zA-Z0-9]'''
keywords = ["://", "http", "https", "ftp", "jdbc", "mongodb", "postgres", "mysql", "redis"]
severity = "high"
category = "generic"
tags = ["url", "credentials", "generic"]
entropy_threshold = 2.5
allowlist = [
    "(?i)user:password",
    "(?i)username:password",
    "(?i)\\$\\{[^}]+\\}:\\$\\{[^}]+\\}",
    "(?i)<[^>]+>:<[^>]+>",
    "(?i)example.com",
    "(?i)localhost",
    "(?i)127\\.0\\.0\\.1",
    "(?i)0\\.0\\.0\\.0",
]
remediation = "Remove credentials from the URL and use environment variables or a secrets manager instead."
