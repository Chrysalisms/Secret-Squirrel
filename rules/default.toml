# Secret Squirrel — Default Detection Rules
#
# Full rule dictionary: Squirrel native rules + Gitleaks rule dictionary.
# Embedded into the binary at compile time via include_str!.
#
# Format: Squirrel TOML (superset of Gitleaks)

# ==============================================================================
# CLOUD — AWS
# ==============================================================================

[[rules]]
id = "aws-access-token"
description = "AWS Access Key ID or temporary credential prefix"
regex = '\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'
keywords = ["a3t", "akia", "asia", "abia", "acca"]
severity = "critical"
category = "cloud"
tags = ["aws", "iam", "cloud"]
entropy_threshold = 3.0
allowlist = [
    '.+EXAMPLE$',
]
validation_provider = "aws"
remediation = "Revoke immediately at https://console.aws.amazon.com/iam/ → Security credentials → Access keys. Rotate all affected IAM permissions and audit CloudTrail for unauthorized usage."

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = "(?i)aws[_\\-]{0,3}secret[_\\-]{0,3}(?:access[_\\-]{0,3})?key\\s{0,5}[:=]\\s{0,5}[\"']?([A-Za-z0-9+/]{40})[\"']"
keywords = ["aws_secret", "aws-secret", "AWS_SECRET"]
severity = "critical"
category = "cloud"
tags = ["aws", "iam", "cloud"]
entropy_threshold = 4.0
remediation = "Revoke at https://console.aws.amazon.com/iam/ and rotate all services using this credential."

[[rules]]
id = "aws-amazon-bedrock-api-key-long-lived"
description = "Long-lived Amazon Bedrock API key"
regex = '''\b(ABSK[A-Za-z0-9+/]{109,269}={0,2})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["absk"]
severity = "critical"
category = "cloud"
tags = ["aws", "bedrock"]
entropy_threshold = 3.0
remediation = "Revoke the Bedrock API key in the AWS console and rotate any services using it."

[[rules]]
id = "alibaba-access-key-id"
description = "Alibaba Cloud AccessKey ID"
regex = '''\b(LTAI(?i)[a-z0-9]{20})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["ltai"]
severity = "critical"
category = "cloud"
tags = ["alibaba", "cloud"]
entropy_threshold = 2.0
remediation = "Disable at https://ram.console.aliyun.com/manage/ak and rotate all services."

[[rules]]
id = "alibaba-secret-key"
description = "Alibaba Cloud Secret Key"
regex = '''(?i)[\w.-]{0,50}?(?:alibaba)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{30})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["alibaba"]
severity = "critical"
category = "cloud"
tags = ["alibaba", "cloud"]
entropy_threshold = 2.0
remediation = "Disable at https://ram.console.aliyun.com/manage/ak and rotate all services."

