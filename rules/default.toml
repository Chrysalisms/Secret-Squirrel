# ==============================================================================
# AI — HuggingFace
# ==============================================================================

[[rules]]
id = "huggingface-token"
description = "HuggingFace User Access Token"
regex = '\bhf_[a-zA-Z0-9]{37}\b'
keywords = ["hf_"]
severity = "high"
category = "ai"
