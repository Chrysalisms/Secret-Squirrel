

# --- Imported Parity Rules ---

[[rules]]
id = "trufflehog-anthropic"
description = "Parity rule for anthropic"
severity = "high"
category = "ai"
keywords = ["anthropic"]
regex = '''(?i)anthropic.{0,50}['":=\s]([a-zA-Z0-9\-_]{16,})'''
entropy = 0.0

