# Security scanning and penetration testing tool API keys
# Covers Shodan, BinaryEdge, Censys, VirusTotal, SecurityTrails, Tenable

[[rules]]
id = "shodan-api-key"
description = "Shodan internet search engine API key"
severity = "high"
category = "saas"
regex = '''(?i)shodan[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9]{32})['"]?'''
keywords = ["shodan", "SHODAN_API"]
entropy = 4.0
tags = ["shodan", "security", "osint"]

