# Extended CRM and sales platform rules
# Covers HubSpot, Salesforce, Pipedrive, Zoho CRM, Copper, Freshsales

[[rules]]
id = "hubspot-api-key-v2"
description = "HubSpot private app access token (pat- prefix)"
severity = "critical"
category = "saas"
regex = '''pat-[a-z]{2}1-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
keywords = ["pat-eu1-", "pat-na1-", "hubspot", "HUBSPOT_TOKEN"]
entropy = 3.0
tags = ["hubspot", "crm", "saas"]

[[rules]]
id = "pipedrive-api-key"
description = "Pipedrive CRM API token"
severity = "high"
category = "saas"
regex = '''(?i)pipedrive[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{40})['"]?'''
keywords = ["pipedrive", "PIPEDRIVE_TOKEN"]
entropy = 4.5
tags = ["pipedrive", "crm", "saas"]

[[rules]]
id = "zoho-crm-api-key"
description = "Zoho CRM / One Auth API key"
severity = "high"
category = "saas"
regex = '''(?i)zoho[._-]?(?:crm[._-]?|one[._-]?)?(?:api[._-]?)?(?:key|token|secret)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,64})['"]?'''
keywords = ["zoho", "ZOHO_API", "ZOHO_TOKEN"]
entropy = 4.0
tags = ["zoho", "crm", "saas"]

