regex = '''(?i)cerner[._-]?(?:smart[._-]?|fhir[._-]?)?(?:client[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,64})['"]?'''
keywords = ["cerner", "CERNER_SECRET"]
entropy = 4.0
tags = ["cerner", "healthcare", "fhir", "ehr"]

