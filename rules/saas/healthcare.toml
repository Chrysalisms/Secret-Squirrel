# Healthcare and biotech API secrets
# Covers Epic, Cerner, FHIR, Veeva, Benchling, Terra

[[rules]]
id = "epic-fhir-api-key"
description = "Epic MyChart FHIR API client key"
severity = "critical"
category = "saas"
regex = '''(?i)epic[._-]?(?:fhir[._-]?|mychart[._-]?)?(?:client[._-]?)?(?:key|id|secret)\s*[=:]\s*['"]?([A-Za-z0-9\-]{36,48})['"]?'''
keywords = ["epic", "EPIC_FHIR", "mychart"]
entropy = 3.5
tags = ["epic", "healthcare", "fhir", "ehr"]

[[rules]]
id = "cerner-smart-api-secret"
description = "Cerner SMART on FHIR API client secret"
severity = "critical"
