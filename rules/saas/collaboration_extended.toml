# Video conferencing and workspace platform secrets
# Covers Zoom, Webex, Microsoft Teams, Google Meet webhooks

[[rules]]
id = "zoom-api-secret"
description = "Zoom OAuth app client secret"
severity = "critical"
category = "saas"
regex = '''(?i)zoom[._-]?(?:client[._-]?|api[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,40})['"]?'''
keywords = ["zoom", "ZOOM_SECRET"]
entropy = 4.0
tags = ["zoom", "video", "collaboration"]

[[rules]]
id = "zoom-jwt-secret"
description = "Zoom JWT app secret key"
severity = "critical"
category = "saas"
regex = '''(?i)zoom[._-]?jwt[._-]?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{16,32})['"]?'''
keywords = ["ZOOM_JWT", "zoom_jwt"]
entropy = 3.5
tags = ["zoom", "jwt", "collaboration"]

[[rules]]
id = "webex-api-token"
description = "Cisco Webex Teams API personal access token"
severity = "high"
category = "saas"
regex = '''(?i)webex[._-]?(?:api[._-]?|access[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40,100})['"]?'''
keywords = ["webex", "WEBEX_TOKEN", "CISCOSPARK"]
entropy = 4.0
tags = ["webex", "cisco", "video", "collaboration"]

[[rules]]
id = "google-workspace-api-key"
description = "Google Workspace (G Suite) Admin SDK API key"
severity = "high"
category = "saas"
regex = '''(?i)(?:google[._-]?workspace|gsuite|google[._-]?admin)[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?(AIza[0-9A-Za-z\-_]{35})['"]?'''
keywords = ["google_workspace", "gsuite", "WORKSPACE_API"]
entropy = 3.5
tags = ["google", "workspace", "admin"]

[[rules]]
id = "microsoft-teams-webhook"
description = "Microsoft Teams incoming webhook URL"
severity = "high"
category = "messaging"
regex = '''https://[a-z0-9]+\.webhook\.office\.com/webhookb2/[a-f0-9\-]{36}@[a-f0-9\-]{36}/IncomingWebhook/[A-Za-z0-9]{32}/[a-f0-9\-]{36}'''
keywords = ["webhook.office.com", "teams_webhook", "TEAMS_WEBHOOK"]
entropy = 4.0
tags = ["microsoft", "teams", "webhook"]

