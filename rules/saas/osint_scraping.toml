# Network scanning and OSINT tool API secrets
# Covers Twilio Lookup, abstract-api.com, ipstack, FullContact, Hunter.io

[[rules]]
id = "ipstack-api-key"
description = "IPStack IP geolocation API access key"
severity = "medium"
category = "saas"
regex = '''(?i)ipstack[._-]?(?:access[._-]?|api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32})['"]?'''
keywords = ["ipstack", "IPSTACK_KEY"]
entropy = 4.0
tags = ["ipstack", "geolocation", "osint"]

[[rules]]
id = "hunter-io-api-key"
description = "Hunter.io email discovery API key"
severity = "medium"
category = "saas"
regex = '''(?i)hunter(?:\.io)?[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{40})['"]?'''
keywords = ["hunter.io", "HUNTER_API"]
entropy = 4.5
tags = ["hunter", "email", "osint"]

