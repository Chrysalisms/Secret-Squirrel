# Legal and compliance platform secrets
# Covers DocuSign, HelloSign, PandaDoc, Clio, Veracode, TrustArc

[[rules]]
id = "docusign-access-token"
description = "DocuSign eSignature API OAuth access token"
severity = "high"
category = "saas"
regex = '''(?i)docusign[._-]?(?:access[._-]?|api[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{64,})['"]?'''
keywords = ["docusign", "DOCUSIGN_TOKEN"]
entropy = 4.5
tags = ["docusign", "esignature", "legal", "saas"]

