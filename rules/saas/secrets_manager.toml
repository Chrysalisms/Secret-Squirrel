# 1Password / Password Manager secrets
# Covers 1Password, Bitwarden, LastPass, HashiCorp Vault service tokens

[[rules]]
id = "1password-secret-key"
description = "1Password secret key (A3- format)"
severity = "critical"
category = "saas"
regex = '''\bA3-[A-Z0-9]{6}-(?:(?:[A-Z0-9]{11})|(?:[A-Z0-9]{6}-[A-Z0-9]{5}))-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\b'''
keywords = ["a3-"]
entropy = 3.8
tags = ["1password", "password-manager", "saas"]

[[rules]]
id = "1password-service-account-token"
description = "1Password service account token (ops_eyJ prefix)"
severity = "critical"
category = "saas"
regex = '''ops_eyJ[a-zA-Z0-9+/]{250,}={0,3}'''
keywords = ["ops_"]
entropy = 4.0
tags = ["1password", "password-manager", "saas"]

[[rules]]
id = "vault-token"
description = "HashiCorp Vault service token (hvs./hvb./hvr. prefix)"
severity = "critical"
category = "saas"
regex = '''\b(hvs\.[a-zA-Z0-9_-]{90,150}|hvb\.[a-zA-Z0-9_-]{138,212}|hvr\.[a-zA-Z0-9_-]{90,150})\b'''
keywords = ["hvs.", "hvb.", "hvr."]
entropy = 4.5
tags = ["vault", "hashicorp", "secrets-manager"]

[[rules]]
id = "vault-root-token"
description = "HashiCorp Vault root token (s. format used in development)"
severity = "critical"
category = "saas"
regex = '''(?i)vault[._-]?(?:root[._-]?)?token\s*[=:]\s*['"]?(s\.[A-Za-z0-9]{24})['"]?'''
keywords = ["vault_token", "VAULT_TOKEN"]
entropy = 3.5
tags = ["vault", "hashicorp", "secrets-manager"]

[[rules]]
id = "doppler-service-token"
description = "Doppler service token for environment access"
severity = "critical"
category = "saas"
regex = '''dp\.st\.[a-z0-9_]{10,}\.[a-zA-Z0-9]{40,}'''
keywords = ["dp.st."]
entropy = 4.0
tags = ["doppler", "secrets-manager", "saas"]

[[rules]]
id = "infisical-token"
description = "Infisical service token for secrets management"
severity = "critical"
category = "saas"
regex = '''(?i)infisical[._-]?(?:service[._-]?)?token\s*[=:]\s*['"]?([a-zA-Z0-9_-]{64})['"]?'''
keywords = ["infisical"]
entropy = 4.5
tags = ["infisical", "secrets-manager", "saas"]

[[rules]]
id = "lastpass-api-key"
description = "LastPass API key or provisioning secret"
severity = "high"
category = "saas"
regex = '''(?i)lastpass[._-]?(?:api[._-]?|provisioning[._-]?)?(?:key|secret|token)\s*[=:]\s*['"]?([A-Za-z0-9]{32,})['"]?'''
keywords = ["lastpass"]
entropy = 4.0
tags = ["lastpass", "password-manager", "saas"]
