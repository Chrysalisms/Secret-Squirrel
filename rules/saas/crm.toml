# Customer support and CRM platform secrets
# Covers Zendesk (extended), Freshdesk, HubSpot, Salesforce, Intercom

[[rules]]
id = "freshdesk-api-key"
description = "Freshdesk / Freshworks customer support API key"
severity = "high"
category = "saas"
regex = '''(?i)freshdesk[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9]{25,32})['"]?'''
keywords = ["freshdesk", "freshworks"]
entropy = 4.0
tags = ["freshdesk", "crm", "saas"]

[[rules]]
id = "hubspot-api-key"
description = "HubSpot private app token or API key"
severity = "high"
category = "saas"
regex = '''pat-[a-z]{2}-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
keywords = ["hubspot", "pat-na-", "pat-eu-"]
entropy = 3.0
tags = ["hubspot", "crm", "saas"]

[[rules]]
id = "salesforce-connected-app-secret"
description = "Salesforce Connected App client secret"
severity = "critical"
category = "saas"
regex = '''(?i)salesforce[._-]?(?:client[._-]?)?secret\s*[=:]\s*['"]?([A-F0-9]{64})['"]?'''
keywords = ["salesforce", "SALESFORCE_CLIENT"]
entropy = 4.5
tags = ["salesforce", "crm", "saas"]

