# Advertising and marketing automation secrets
# Covers Google Ads, Meta Ads, LinkedIn Ads, TikTok Ads, Mailchimp (extended)

[[rules]]
id = "google-ads-developer-token"
description = "Google Ads API developer token"
severity = "high"
category = "saas"
regex = '''(?i)google[._-]?ads[._-]?(?:developer[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{22})['"]?'''
keywords = ["google_ads", "GOOGLE_ADS_DEV_TOKEN", "developer_token"]
entropy = 3.0
tags = ["google", "ads", "marketing"]

[[rules]]
id = "google-ads-client-secret"
description = "Google Ads OAuth client secret"
severity = "high"
category = "saas"
regex = '''(?i)google[._-]?ads[._-]?(?:oauth[._-]?|client[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{24,64})['"]?'''
keywords = ["google_ads", "GOOGLE_ADS_SECRET"]
entropy = 4.0
tags = ["google", "ads", "oauth"]

