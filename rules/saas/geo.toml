# Geographic and mapping service secrets
# Covers Google Maps, Mapbox, HERE, TomTom, Foursquare, Yelp

[[rules]]
id = "here-api-key"
description = "HERE Location Services API key"
severity = "high"
category = "saas"
regex = '''(?i)here[._-]?(?:location[._-]?|maps[._-]?)?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40,48})['"]?'''
keywords = ["here", "HERE_API"]
entropy = 4.0
tags = ["here", "maps", "location"]

[[rules]]
id = "tomtom-api-key"
description = "TomTom Maps API key"
severity = "high"
category = "saas"
regex = '''(?i)tomtom[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32})['"]?'''
keywords = ["tomtom"]
entropy = 4.0
tags = ["tomtom", "maps", "navigation"]

[[rules]]
id = "ipgeolocation-api-key"
description = "IPGeolocation.io API key for IP-to-location lookups"
severity = "medium"
category = "saas"
regex = '''(?i)(?:ipgeo|ipgeolocation)[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{32,48})['"]?'''
keywords = ["ipgeolocation", "ipgeo"]
entropy = 4.0
tags = ["ipgeolocation", "geolocation"]

