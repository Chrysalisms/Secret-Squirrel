# Telecommunications and phone number service secrets
# Covers Bandwidth, Plivo, Telnyx, Daily.co, LiveKit, Agora, Zoom

[[rules]]
id = "bandwidth-api-secret"
description = "Bandwidth communications platform API token"
severity = "high"
category = "saas"
regex = '''(?i)bandwidth[._-]?(?:api[._-]?)?(?:token|secret|password)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{20,32})['"]?'''
keywords = ["bandwidth", "BW_API"]
entropy = 3.5
tags = ["bandwidth", "voip", "saas"]

[[rules]]
id = "plivo-auth-token"
description = "Plivo voice and SMS authentication token"
severity = "high"
category = "saas"
regex = '''(?i)plivo[._-]?(?:auth[._-]?)?token\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40})['"]?'''
keywords = ["plivo", "PLIVO_AUTH"]
entropy = 4.0
tags = ["plivo", "sms", "voip", "saas"]

[[rules]]
id = "telnyx-api-key"
description = "Telnyx cloud communications API key (KEY01 prefix)"
severity = "high"
category = "saas"
regex = '''KEY01[A-Za-z0-9_\-]{50,70}'''
keywords = ["KEY01", "telnyx"]
entropy = 4.5
tags = ["telnyx", "voip", "sms"]

[[rules]]
id = "daily-api-key"
description = "Daily.co WebRTC video API key"
severity = "high"
category = "saas"
regex = '''(?i)daily[._-]?(?:co[._-]?)?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})['"]?'''
keywords = ["daily.co", "DAILY_API"]
entropy = 3.0
tags = ["daily", "webrtc", "video", "saas"]

