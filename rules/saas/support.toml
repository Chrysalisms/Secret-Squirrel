# Customer support and ticketing platform secrets
# Covers Zendesk (extended), Freshdesk, Intercom, HelpScout, Front, Kustomer

[[rules]]
id = "helpscout-api-key"
description = "Help Scout support platform API key"
severity = "high"
category = "saas"
regex = '''(?i)helpscout[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{40})['"]?'''
keywords = ["helpscout", "HELPSCOUT_API"]
entropy = 4.5
tags = ["helpscout", "customer-support", "saas"]

[[rules]]
id = "kustomer-api-key"
