severity = "high"
category = "saas"
regex = '''(?i)kustomer[._-]?(?:api[._-]?)?(?:key|token)\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,64})['"]?'''
keywords = ["kustomer"]
entropy = 4.0
tags = ["kustomer", "crm", "support"]

