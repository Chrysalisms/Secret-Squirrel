# HR and talent management platform secrets
# Covers Workday, ADP, Greenhouse, Lever, BambooHR, Rippling

[[rules]]
id = "workday-client-secret"
description = "Workday HCM REST API client secret"
severity = "critical"
category = "saas"
regex = '''(?i)workday[._-]?(?:api[._-]?|client[._-]?)?secret\s*[=:]\s*['"]?([A-Za-z0-9_\-]{32,64})['"]?'''
keywords = ["workday", "WORKDAY_SECRET"]
entropy = 4.0
tags = ["workday", "hr", "hcm", "saas"]

