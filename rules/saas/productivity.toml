# Productivity / Collaboration SaaS secrets
# Covers Airtable, Algolia, Asana, Atlassian/Jira/Confluence, Contentful, Beamer

[[rules]]
id = "airtable-api-key"
description = "Airtable API key"
severity = "high"
category = "saas"
regex = '''(?i)[\w.-]{0,50}?(?:airtable)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{17})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["airtable"]
entropy = 3.0
tags = ["airtable", "productivity", "saas"]

[[rules]]
id = "airtable-personal-access-token"
description = "Airtable Personal Access Token"
severity = "critical"
category = "saas"
regex = '''\b(pat[[:alnum:]]{14}\.[a-f0-9]{64})\b'''
keywords = ["airtable"]
entropy = 4.5
tags = ["airtable", "productivity", "saas"]

